name: Rent Manager Backup

on:
  schedule:
    - cron: "11 21 * * *"   # 02:00 UTC every day — adjust as needed
  workflow_dispatch: {}     # allows manual "Run workflow" button

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Create credential files from secrets
        run: |
          mkdir -p credentials
          echo "$OAUTH_CLIENT" > credentials/oauth-client.json
          echo "$DRIVE_TOKEN" > credentials/drive-token.json
          cat > .env.backup <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY
          GOOGLE_OAUTH_CLIENT_PATH=./credentials/oauth-client.json
          GOOGLE_OAUTH_TOKEN_PATH=./credentials/drive-token.json
          GOOGLE_DRIVE_FOLDER_ID=$GOOGLE_DRIVE_FOLDER_ID
          EOF
        env:
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}

      - name: Run backup
        run: npm run backup

      - name: Clean up credential files
        if: always()
        run: |
          rm -f credentials/oauth-client.json
          rm -f credentials/drive-token.json
          rm -f .env.backup